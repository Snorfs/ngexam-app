<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep NG - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/login.js" defer></script>
</head>

<body class="bg-[#ffffff] font-['Inter']">

  <main class="w-full max-w-[1280px] mx-auto bg-white md:h-[calc(100vh-32px)] lg:my-4 lg:grid lg:grid-cols-2">

    <!-- LEFT -->
    <section class="bg-[#063F35] text-[#FFFFFF] px-6 pt-8 sm:p-10 md:px-12 lg:p-14 flex flex-col justify-between -mt-6">

      <div class="flex items-center gap-2">
        <img src="/Images/logo.png" alt="logo">
        <p class="text-[18px] md:text-[16px] font-extrabold">ExamPrep NG</p>
      </div>

      <div class="mt-6">
        <h1 class="text-[32px] lg:text-[31px] font-bold">
          Practice today,<br>
          <span class="text-[#319F43]">Score tomorrow.</span>
        </h1>

        <p class="my-4 max-w-[310px] text-[15px] md:text-[16px] leading-[30px] tracking-[0.332px] text-white">
          JAMB practice, CBT simulations and personalised learning to help you reach your goals.
        </p>
      </div>

      <div class="mt-12 space-y-8 lg:space-y-9 -ml-10">
        <img src="/Images/Learning-cuate 1.png" alt="learning">
      </div>

    </section>


    <!-- RIGHT -->
    <section class="bg-[#FFFFFF] px-6 py-12 sm:px-10 sm:py-14 md:px-14 lg:px-[68px] lg:py-0 flex items-center overflow-hidden">

      <div class="w-full max-w-[500px] mx-auto">

        <div class="mb-10">
          <p class="mt-2 text-[13px] md:text-[16px] font-bold text-[#78909C]">
            Log in continue your preparation.
          </p>

          <h2 class="flex items-center gap-2 text-[28px] md:text-[32px] font-bold text-[#085848]">
            Welcome back
            <span class="text-[24px]">👋</span>
          </h2>
        </div>


        <!-- LOGIN FORM -->
        <form id="login-form" class="space-y-5">

          <p id="login-message" class="hidden text-[13px] font-semibold text-green-600"></p>
          <p id="login-error" class="hidden text-[13px] font-semibold text-red-600"></p>

          <!-- EMAIL -->
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">
            <img src="/Images/email.png" alt="Email icon" class="w-5 h-5 shrink-0">

            <input
              id="email"
              type="text"
              placeholder="Email Address"
              autocomplete="username"
              required
              class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold"
            >
          </div>


          <!-- PASSWORD -->
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/Password.png" alt="Password icon" class="w-5 h-5 shrink-0">

            <input
              id="password"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
              required
              class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold"
            >

            <button id="togglePassword" type="button" class="w-7 h-7 flex items-center justify-center shrink-0" aria-label="Show password">
              <img id="togglePasswordImage" src="/Images/view.png" alt="Show password" class="w-5 h-5 object-contain">
            </button>

          </div>


          <!-- FORGOT -->
          <div class="flex justify-end -mt-1">
            <a href="/forgotpass.html" class="text-[16px] font-bold text-[#085848]">
              Forgot Password ?
            </a>
          </div>


          <!-- LOGIN BUTTON -->
          <button type="submit" class="w-full p-3 mt-5 bg-[#085848] rounded-[9px] text-[#FFFFFF] text-[20px] font-bold flex items-center justify-center gap-3 transition">
            Log in
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </button>

        </form>


        <div class="my-10 flex items-center gap-5">
          <div class="h-px bg-[#78909C] flex-1"></div>
          <span class="text-[11px] font-bold text-[#78909C]">OR</span>
          <div class="h-px bg-[#78909C]/70 flex-1"></div>
        </div>


        <!-- GOOGLE -->
        <button id="google-login" type="button" class="w-full p-4 border border-[#D9D9D9] rounded-[10px] bg-[#FFFFFF] flex items-center justify-center gap-3 text-[15px] font-bold text-[#085848]">
          <img src="/Images/google.png" alt="Google logo" class="w-6 h-6">
          Continue with Google
        </button>


        <p class="mt-8 text-center text-[15px] font-bold text-[#78909C]">
          Don't have an account?
          <a href="/studentsignup.html" class="ml-1 text-[#056959] font-bold">Sign Up</a>
        </p>

      </div>

    </section>

  </main>


  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>
</html>
