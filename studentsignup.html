<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep NG - Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/login.js" defer></script>
</head>

<body class="bg-[#ffffff] font-['Inter']">

  <main class="w-full max-w-[1280px] mx-auto bg-white md:h-[calc(100vh-32px)] lg:mt-4 lg:grid lg:grid-cols-2">

    <!-- LEFT -->
    <section class="bg-[#063F35] text-[#FFFFFF] px-6 py-4 md:px-12 flex flex-col items-start -mt-6">

      <div class="flex items-center gap-2 mt-5">
        <img src="/Images/logo.png" alt="logo">
        <p class="text-[17px] font-extrabold">ExamPrep NG</p>
      </div>

      <div class="mt-4">
        <h1 class="text-[32px] lg:text-[31px] font-bold leading-10">
          Build your skills.<br>
          <span class="text-[#319F43]">Achieve your goals.</span>
        </h1>

        <p class="mt-4 max-w-[310px] text-[16px] leading-7 tracking-[0.332px] text-white font-medium">
          Get access to past questions, CBT simulations and personalised learning to help you prepare for JAMB and other exams.
        </p>
      </div>

      <img src="/Images/Learning-rafiki 1.png" alt="person" class="mt-5 -ml-9">

    </section>


    <!-- RIGHT -->
    <section class="bg-white px-6 py-8 md:px-14 flex items-center">

      <div class="w-full max-w-[500px] mx-auto">

        <div class="mb-10">
          <h2 class="flex items-center gap-2 text-[28px] md:text-[32px] font-bold text-[#085848]">
            Create your account
          </h2>

          <p class="mt-2 text-[13px] md:text-[16px] font-bold text-[#78909C]">
            Start your journey to better results.
          </p>
        </div>


        <!-- SIGNUP FORM -->
        <form id="signup-form" class="space-y-5">

          <p id="signup-error" class="hidden text-[13px] font-semibold text-red-600"></p>

          <!-- FULL NAME -->
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">
            <img src="/Images/name.png" alt="contact" class="w-5 h-5 shrink-0">

            <input
              id="name"
              type="text"
              placeholder="Full name"
              autocomplete="name"
              required
              class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold"
            >
          </div>


          <!-- EMAIL -->
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">
            <img src="/Images/email.png" alt="Email icon" class="w-5 h-5 shrink-0">

            <input
              id="email"
              type="email"
              placeholder="Email address"
              autocomplete="email"
              required
              class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold"
            >
          </div>


          <!-- PASSWORD -->
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/Password.png" alt="Password icon" class="w-5 h-5 shrink-0">

            <input
              id="password"
              type="password"
              placeholder="Password"
              autocomplete="new-password"
              required
              class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold"
            >

            <button id="togglePassword" type="button" class="w-7 h-7 flex items-center justify-center shrink-0" aria-label="Show password">
              <img id="togglePasswordImage" src="/Images/view.png" alt="Show password" class="w-5 h-5 object-contain">
            </button>

          </div>


          <!-- CONFIRM PASSWORD -->
          <div class="border border-[#D9D9D9] rounded-[10px] p-4 flex items-center gap-4">

            <img src="/Images/Password.png" alt="Password icon" class="w-5 h-5 shrink-0">

            <input
              id="confirm-password"
              type="password"
              placeholder="Confirm Password"
              autocomplete="new-password"
              required
              class="flex-1 border-none outline-none bg-transparent text-[16px] text-[#78909C] placeholder:text-[#78909C] placeholder:font-bold"
            >

            <button id="toggleConfirmPassword" type="button" class="w-7 h-7 flex items-center justify-center shrink-0" aria-label="Show password">
              <img id="toggleConfirmPasswordImage" src="/Images/view.png" alt="Show password" class="w-5 h-5 object-contain">
            </button>

          </div>


          <!-- SIGN UP BUTTON -->
          <button type="submit" class="w-full h-[52px] mt-5 bg-[#085848] rounded-[9px] text-[#FFFFFF] text-[20px] font-bold flex items-center justify-center gap-3 transition">
            Sign Up
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </button>

        </form>


        <div class="my-10 flex items-center gap-5">
          <div class="h-px bg-[#78909C]/70 flex-1"></div>
          <span class="text-[11px] font-bold text-[#78909C]">OR</span>
          <div class="h-px bg-[#78909C]/70 flex-1"></div>
        </div>


        <!-- GOOGLE -->
        <button id="google-login" type="button" class="w-full p-4 border border-[#D9D9D9] rounded-[10px] bg-[#FFFFFF] flex items-center justify-center gap-3 text-[15px] font-bold text-[#085848]">
          <img src="/Images/google.png" alt="Google logo" class="w-6 h-6">
          Continue with Google
        </button>


        <p class="mt-8 text-center text-[15px] font-bold text-[#78909C]">
          Already have an account?
          <a href="/studentlogin.html" class="ml-1 text-[#056959] font-bold">Login</a>
        </p>

      </div>

    </section>

  </main>


  <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>
</html>
